name: CI/CD Task Manager

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Publish Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download dependencies
        run: mvn -B dependency:resolve

      - name: Run automated tests
        run: mvn -B clean test

      - name: Build project package
        run: mvn -B package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-jar
          path: target/task-manager-1.0.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Pipeline result
        run: |
          echo "Pipeline completed successfully."
          echo "Tests passed and artifact target/task-manager-1.0.0.jar is ready for delivery."
